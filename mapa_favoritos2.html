function fechaEspagnola(){
  var d=new Date();
  var meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return d.getDate()+' de '+meses[d.getMonth()]+' de '+d.getFullYear();
}

function primeraVacante(g){
  if(!g.rows||!g.rows.length)return null;
  for(var i=0;i<g.rows.length;i++){
    if(Number(g.rows[i].vacantes)>0)return g.rows[i];
  }
  return g.rows[0];
}

function buildEmailBody(g,r){
  var c=CONTACTS[g.provincia]||{};
  var fecha=fechaEspagnola();
  return 'A la atención del Ilmo. Sr. Coronel Jefe de la Comandancia de '+g.provincia+'\n\n'+
  'Asunto: Solicitud de información sobre régimen de jornada, horario y turnos de vacante anunciada.\n\n'+
  'D./Dña. Ruth Fernandez Ramos, con DNI/NIE [NÚMERO], con destino actual en [UNIDAD Y LOCALIDAD], en calidad de guardia civil de la Escala de Cabos y Guardias, con número de empleado [SI SE DISPONE], respetuosamente expone:\n\n'+
  'Que, con carácter previo a la solicitud de la vacante anunciada en el BOGC núm. 87, de 27 de octubre de 2026, Resolución 2630008, desea conocer el régimen de prestación del servicio del siguiente puesto:\n\n'+
  '• Puesto: '+r.unidad+'\n'+
  '• Localidad / residencia: '+g.municipio+' ('+g.provincia+')\n'+
  '• Concurso: '+r.concurso+'\n'+
  '• Puntos de la vacante: '+(r.puntos||'No disponible')+'\n\n'+
  'Al amparo del artículo 28.3 de la Ley Orgánica 11/2007, de 22 de octubre, reguladora de los derechos y deberes de los miembros de la Guardia Civil, solicita que se le informe, con la mayor precisión posible, de los siguientes extremos:\n\n'+
  '1. Régimen de prestación del servicio del puesto: ordinario, a turnos u otro.\n'+
  '2. Tramos horarios habituales, indicando, en su caso, mañana, tarde y noche, y su duración.\n'+
  '3. Cadencia o secuencia de turnos, si el puesto se presta a turnos.\n'+
  '4. Si el horario o cuadrante varía a lo largo del año, especialmente entre invierno y verano o por estacionalidad turística.\n'+
  '5. Antelación con la que se comunica el cuadrante o el servicio diario.\n'+
  '6. Si el puesto forma parte de un núcleo operativo, sistema de turnos o cuadrante común con otras unidades.\n\n'+
  'Este correo no supone la presentación de una solicitud de destino ni compromete su realización; únicamente expresa interés preliminar en la vacante y solicitud de información.\n\n'+
  'Esta información se solicita exclusivamente para valorar la solicitud de la vacante y ejercer el derecho reconocido en el artículo 28.3 de la Ley Orgánica 11/2007.\n\n'+
  'Por lo expuesto, solicita se tenga por presentada esta instancia y se le facilite respuesta escrita a la mayor brevedad.\n\n'+
  'En Valderas, a '+fecha+'.\n\n'+
  'Fdo.: Ruth Fernandez Ramos';
}

function sendVacancyEmail(g){
  var r=primeraVacante(g);
  if(!r){alert('No hay datos de vacante disponibles para esta localidad.');return}
  var c=CONTACTS[g.provincia]||{};
  if(!c.correo){alert('No hay correo de Comandancia disponible para '+g.provincia+'.');return}
  var mensaje='¿Abrir un borrador de Gmail para esta vacante?\n\n'+
    'Localidad: '+g.municipio+' ('+g.provincia+')\n'+
    'Puesto: '+r.unidad+'\n'+
    'Concurso: '+r.concurso+'\n'+
    'Vacantes: '+r.vacantes+'\n'+
    'Puntos: '+(r.puntos||'No disponible')+'\n'+
    'Destinatario: '+c.correo+'\n\n'+
    'Este correo no presentará automáticamente la solicitud; solo abrirá un borrador para tu revisión y envío.';
  if(!confirm(mensaje))return;
  var asunto='Solicitud de información sobre régimen de jornada, horario y turnos de vacante anunciada';
  var cuerpo=buildEmailBody(g,r);
  var gmailUrl='https://mail.google.com/mail/?view=cm&fs=1'+
    '&to='+encodeURIComponent(c.correo)+
    '&su='+encodeURIComponent(asunto)+
    '&body='+encodeURIComponent(cuerpo);
  window.open(gmailUrl,'_blank','noopener');
}

  html += '<ul><li><a target="_blank" rel="noopener noreferrer" href="' + esc(gcSafeSource(GC_INV2017.fuente.url)) + '">Respuesta del Gobierno al Congreso, anexo por municipios</a> · ' + esc(GC_INV2017.fuente.fecha) + '</li>' +

function gcInvStats() {

function gcHousingStats() {

  var selected = sorted.filter(function (g) {
    return gcHasHousing(g) && (!q || norm(g.municipio + ' ' + g.provincia).includes(q));

    if (marker._gcHousingKey && housingByKey.has(marker._gcHousingKey)) visible.add(marker._gcHousingKey);
  });

  output.textContent = housingByKey.size + ' municipios con evidencia aceptada de ' + GC_HOUSING.scope_count +
    ' con vacantes 2026. ' + visible.size + ' visibles con los filtros actuales.' +
    (missingCount ? ' ' + missingCount + ' coincidencias sin coordenadas.' : '') +
    (gcHousingOnly() && !visible.size ? ' No hay resultados visibles; prueba a borrar la búsqueda o activar Vacantes anunciadas.' : '');
